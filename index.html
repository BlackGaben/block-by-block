<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Block by Block</title>
<meta name="theme-color" content="#1f8a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Block by Block">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#dff0f1;--card:#ffffff;--ink:#16343a;--mute:#5d7a80;--line:#cfe1e3;
  --coin:#f2b32d;--coinink:#5a3f00;--brick:#e0553b;--teal:#1f8a86;--tealink:#ffffff;
  --grass1:#8fcf8a;--grass2:#80c47c;--paved:#c7cdc4;--soil:#a9835a;
  --head:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--sky:#0f2227;--card:#173039;--ink:#e4f2f0;--mute:#8fb0b5;--line:#264650;
    --grass1:#4f8f54;--grass2:#478749;--paved:#56605c;--soil:#6b5339;--coinink:#2b1d00;--teal:#34b3ad;--tealink:#06211f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--sky);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--head);font-weight:800;font-size:18px;white-space:nowrap}
.stats{display:flex;gap:8px;align-items:center}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill.coin{background:var(--coin);color:var(--coinink);border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.mute{color:var(--mute)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--teal);color:var(--tealink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--brick);color:var(--brick)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
nav button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--mute)}
nav button span{font-size:22px;line-height:1.1}
nav button.on{color:var(--teal)}
/* tasks */
.task{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.task:last-child{border-bottom:0}
.box{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--c,var(--teal));display:grid;place-items:center;font-weight:800;color:transparent;transition:background .15s,transform .15s}
.task.done .box{background:var(--c,var(--teal));color:#fff;transform:scale(1.06)}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.tt{font-weight:600}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.bar.gold i{background:var(--coin)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--teal);color:var(--tealink);border-color:var(--teal)}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:600;margin:0 0 9px}
.opt.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--card))}
input[type=text],input[type=time],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
/* wizard */
.wrap.wiz{min-height:100vh;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 22px}
.prog i{display:block;height:100%;background:var(--coin);transition:width .25s}
.sec{font-family:var(--head);color:var(--teal);font-weight:700;font-size:15px}
.wiz h2{font-size:27px;margin:4px 0 18px}
.wiz .foot{margin-top:auto;display:flex;gap:10px;padding-top:18px}
.wiz .foot .btn:last-child{flex:1}
/* city */
.scene{--s:min(62vw,400px);height:calc(var(--s)*.93);display:grid;place-items:center;margin:18px 0 8px}
.board{width:var(--s);height:var(--s);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);transform:rotateX(58deg) rotateZ(45deg);transform-style:preserve-3d;position:relative}
.board::before{content:"";position:absolute;inset:-2.5%;background:var(--soil);border-radius:6px;transform:translateZ(-12px)}
.tile{position:relative;transform-style:preserve-3d;cursor:pointer;outline-offset:-3px}
.tile.a{background:var(--grass1)}.tile.b{background:var(--grass2)}
.tile.has{background:var(--paved)}
.tile:not(.has):hover{filter:brightness(1.12)}
.bld{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.bld span{position:absolute;left:0;top:0;display:block;line-height:1;font-size:calc(var(--s)/8*.82);transform-origin:0 0;transform:rotateZ(-45deg) rotateX(-58deg) translate(-50%,-88%);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
/* sheet */
.shade{position:fixed;inset:0;background:rgba(10,25,30,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--sky);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.bl{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.bl .e{font-size:30px;width:40px;text-align:center}
.bl .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--sky);padding:10px 16px;border-radius:99px;font-weight:700;z-index:30;animation:fade .2s;max-width:90vw;text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.grp{font-family:var(--head);font-weight:700;margin:20px 0 4px;display:flex;align-items:center;gap:7px}
.qa{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.qa b{font-weight:600;color:var(--mute);font-size:14px;flex:none;max-width:48%}
.qa span{text-align:right;font-weight:600;overflow-wrap:anywhere}
.empty{text-align:center;padding:28px 10px}
.empty .big{font-size:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
"use strict";
/* ============ helpers ============ */
const KEY='blockbyblock.v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const list=s=>String(s||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYORDER=[1,2,3,4,5,6,0];

const CATS={
  health:{n:'Health',e:'💪',c:'#e0553b'},mind:{n:'Mind',e:'🧠',c:'#7b5cd6'},
  work:{n:'Focus',e:'🎯',c:'#2b7fd4'},home:{n:'Home',e:'🏠',c:'#d98a1f'},
  social:{n:'People',e:'💬',c:'#d94f8c'},money:{n:'Money',e:'🪙',c:'#2f9e6b'},
  create:{n:'Create',e:'🎨',c:'#b04fd0'},digital:{n:'Digital',e:'🔕',c:'#3a9fb0'},
  sleep:{n:'Sleep',e:'🌙',c:'#4a63c9'}
};

/* ============ questions ============ */
const FOC=[['health','💪 Health & fitness'],['mind','🧠 Mind & learning'],['work','🎯 Work & focus'],['home','🏠 Home & chores'],['social','💬 People & relationships'],['money','🪙 Money'],['create','🎨 Creativity & hobbies'],['digital','🔕 Digital wellbeing'],['sleep','🌙 Sleep & rest']];
const on=k=>a=>(a.focus||[]).includes(k);
const Q=[
 {id:'name',sec:'About you',type:'text',q:"First things first: what should I call you?",short:'Name',ph:'Your name'},
 {id:'age',sec:'About you',type:'single',q:"Which age range fits you?",short:'Age',opts:['Under 18','18–24','25–34','35–44','45–54','55+']},
 {id:'status',sec:'About you',type:'single',q:"What does a typical weekday look like?",short:'Weekday',opts:['School or university','Full-time job','Part-time job','Working for myself','Between things','Caring for others at home']},
 {id:'goal',sec:'About you',type:'text',q:"What do you most want to be different in 3 months?",short:'3-month goal',ph:'e.g. fitter, calmer, finished my thesis'},
 {id:'wake',sec:'Your rhythm',type:'time',q:"When do you usually wake up?",short:'Wake time',def:'07:00'},
 {id:'bed',sec:'Your rhythm',type:'time',q:"When do you want to be asleep by?",short:'Bedtime',def:'23:00'},
 {id:'chrono',sec:'Your rhythm',type:'single',q:"When do you feel sharpest?",short:'Sharpest at',opts:['Morning','Afternoon','Evening','It varies']},
 {id:'baseEnergy',sec:'Your rhythm',type:'single',q:"How's your energy on a typical day?",short:'Typical energy',opts:['Usually low','Up and down','Usually good']},
 {id:'free',sec:'Your rhythm',type:'single',q:"How much time can you realistically give your tasks each day?",short:'Daily time',opts:['15 min','30 min','1 hour','90+ min']},
 {id:'weekend',sec:'Your rhythm',type:'single',q:"How should weekends feel?",short:'Weekends',opts:[['Same','Same as weekdays'],['Lighter','Lighter, I want rest'],['Heavier','Heavier, I have more time']]},
 {id:'diff',sec:'Your style',type:'single',q:"How hard should I push you?",short:'Difficulty',opts:[['Gentle','Gentle: build habits slowly'],['Balanced','Balanced'],['Ambitious','Ambitious: challenge me']]},
 {id:'struggle',sec:'Your style',type:'multi',q:"What gets in your way most? Pick any.",short:'Obstacles',opts:[['procrastination','Putting things off'],['consistency','Staying consistent'],['energy','Low energy'],['stress','Stress'],['distraction','Getting distracted'],['motivation','Low motivation'],['overwhelm','Feeling overwhelmed']]},
 {id:'focus',sec:'Your life areas',type:'multi',q:"Which areas do you want to improve? I'll ask more about each one you pick.",short:'Focus areas',opts:FOC,req:true},

 {id:'exNow',sec:'Health',type:'single',q:"How often do you exercise right now?",short:'Exercise now',opts:['Never','1–2 times','3–4 times','5+ times'],show:on('health')},
 {id:'exTypes',sec:'Health',type:'multi',q:"What kinds of movement do you enjoy (or might)?",short:'Movement types',opts:['Walking','Running','Gym / weights','Yoga / stretching','Cycling','Swimming','Home workouts','Team sports','Dancing'],show:on('health')},
 {id:'steps',sec:'Health',type:'single',q:"Do you want a daily step goal?",short:'Step goal',opts:[['4000','4,000 steps'],['7000','7,000 steps'],['10000','10,000 steps'],['none',"I don't track steps"]],show:on('health')},
 {id:'water',sec:'Health',type:'single',q:"What about water?",short:'Water',opts:[['none','Skip this'],['1.5','1.5 litres'],['2','2 litres'],['3','3 litres']],show:on('health')},
 {id:'eat',sec:'Health',type:'multi',q:"Any eating goals?",short:'Eating goals',opts:[['veg','Eat more vegetables'],['sugar','Less sugar'],['cook','Cook at home more'],['protein','More protein'],['snack','Less late snacking'],['prep','Weekly meal prep']],show:on('health')},
 {id:'limits',sec:'Health',type:'text',q:"Any injuries or limits I should respect? (optional)",short:'Limits',ph:'e.g. bad knee, no running',show:on('health'),optional:true},

 {id:'read',sec:'Mind',type:'single',q:"How much would you like to read each day?",short:'Reading',opts:[['0',"I don't want a reading habit"],['10','10 minutes'],['20','20 minutes'],['30','30+ minutes']],show:on('mind')},
 {id:'med',sec:'Mind',type:'single',q:"Meditation or breathing exercises?",short:'Meditation',opts:['Never tried','Tried it once or twice','Sometimes','I do it already','Not for me'],show:on('mind')},
 {id:'journal',sec:'Mind',type:'single',q:"Journaling?",short:'Journaling',opts:['Never','Sometimes','Daily already','Not for me'],show:on('mind')},
 {id:'learn',sec:'Mind',type:'text',q:"Is there something you want to learn? Name it (or leave empty).",short:'Learning',ph:'e.g. Spanish, guitar, statistics',show:on('mind'),optional:true},
 {id:'learnMin',sec:'Mind',type:'single',q:"How long each day for learning?",short:'Learning time',opts:['10','20','30','45'].map(x=>[x,x+' min']),show:a=>on('mind')(a)&&!!(a.learn||'').trim()},

 {id:'project',sec:'Work & focus',type:'text',q:"What's your main project or priority right now?",short:'Main project',ph:'e.g. thesis, launch, portfolio',show:on('work'),optional:true},
 {id:'deep',sec:'Work & focus',type:'single',q:"How many focused work blocks per day feels right?",short:'Focus blocks',opts:[['0','None'],['1','1 block'],['2','2 blocks'],['3','3 blocks']],show:on('work')},
 {id:'plan',sec:'Work & focus',type:'single',q:"When do you plan your day?",short:'Planning',opts:[['night','The night before'],['morning','In the morning'],['never','I mostly don\'t']],show:on('work')},
 {id:'distract',sec:'Work & focus',type:'multi',q:"What distracts you the most?",short:'Distractions',opts:[['phone','My phone'],['social','Social media'],['email','Email and chat'],['noise','Noise'],['unclear','Unclear next steps']],show:on('work')},

 {id:'chores',sec:'Home',type:'multi',q:"Which home tasks do you want covered?",short:'Chores',opts:['Dishes','Laundry','Tidy up','Vacuum / clean','Groceries','Declutter','Plants / pets'],show:on('home')},
 {id:'tidy',sec:'Home',type:'single',q:"How tidy is home right now?",short:'Tidiness',opts:['A mess','Okay','Pretty tidy'],show:on('home')},

 {id:'people',sec:'People',type:'text',q:"Who do you want to stay in touch with? Separate names with commas.",short:'People',ph:'e.g. Mum, Alex, Jo',show:on('social'),optional:true},
 {id:'touch',sec:'People',type:'single',q:"How often should I nudge you to reach out?",short:'Reach-out rhythm',opts:[['daily','Every day'],['few','Every few days'],['weekly','Weekly']],show:on('social')},
 {id:'socialGoals',sec:'People',type:'multi',q:"What do you want more of?",short:'Social goals',opts:[['new','Meeting new people'],['deepen','Deeper friendships'],['family','Family time'],['partner','Time with a partner']],show:on('social')},

 {id:'moneyGoals',sec:'Money',type:'multi',q:"What are your money goals?",short:'Money goals',opts:[['track','Track my spending'],['save','Save regularly'],['debt','Pay off debt'],['invest','Invest'],['subs','Cut subscriptions']],show:on('money')},

 {id:'hobbies',sec:'Creativity',type:'text',q:"Which hobbies or creative things do you want time for? Use commas.",short:'Hobbies',ph:'e.g. drawing, guitar, writing',show:on('create'),optional:true},
 {id:'hobbyMin',sec:'Creativity',type:'single',q:"How long per session?",short:'Hobby session',opts:['15','30','45','60'].map(x=>[x,x+' min']),show:a=>on('create')(a)&&list(a.hobbies).length>0},

 {id:'screen',sec:'Digital wellbeing',type:'single',q:"Do you want a daily screen-time cap?",short:'Screen time',opts:[['none','No cap'],['4','Under 4 hours'],['3','Under 3 hours'],['2','Under 2 hours']],show:on('digital')},
 {id:'phoneFree',sec:'Digital wellbeing',type:'multi',q:"When should your phone stay away?",short:'Phone-free times',opts:[['morning','First hour after waking'],['meals','During meals'],['bed','Last hour before bed']],show:on('digital')},
 {id:'social',sec:'Digital wellbeing',type:'single',q:"Social media limit?",short:'Social media',opts:[['none','No limit'],['60','1 hour'],['30','30 minutes'],['15','15 minutes']],show:on('digital')},

 {id:'wind',sec:'Sleep',type:'multi',q:"What would a good wind-down include?",short:'Wind-down',opts:[['screens','Screens off'],['read','Reading'],['stretch','Stretching'],['tea','Herbal tea'],['dump','Writing down worries']],show:on('sleep')},
 {id:'caffeine',sec:'Sleep',type:'time',q:"Latest time for caffeine?",short:'Caffeine cutoff',def:'14:00',show:on('sleep')},
];
const DEEP=[
 {id:'d1',q:"What's one small thing you've been avoiding?",ph:'e.g. call the dentist',task:t=>'Do: '+t},
 {id:'d2',q:"Which habit would you like to add next?",ph:'e.g. morning stretch',task:t=>t},
 {id:'d3',q:"What's one spot at home that bugs you?",ph:'e.g. the desk drawer',task:t=>'Fix: '+t},
 {id:'d4',q:"What drains your energy the most?",ph:'e.g. long meetings'},
 {id:'d5',q:"What's a small win from this week?",ph:'Anything counts'},
 {id:'d6',q:"What reward would feel great after a strong week?",ph:'e.g. a long bath, a new book'},
 {id:'d7',q:"Who inspires you, and why?",ph:'A person and a reason'},
 {id:'d8',q:"What would make tomorrow 10% better?",ph:'One idea',task:t=>t},
];
const visibleQs=()=>Q.filter(q=>!q.show||q.show(S.a));

/* ============ task generation ============ */
function gen(a){
  const out=[],seen=new Set();
  const T=(title,cat,min,pri=2,days=null,key='')=>{const id='a-'+cat+'-'+slug(title)+key;if(seen.has(id))return;seen.add(id);out.push({id,title,cat,min,pri,days,src:'auto'})};
  const foc=k=>(a.focus||[]).includes(k),has=(k,v)=>(a[k]||[]).includes(v);
  const diff=a.diff||'Balanced';
  const dm=diff==='Ambitious'?1:diff==='Gentle'?-1:0;
  const st=a.struggle||[];

  // universal
  const planTitle=a.plan==='night'?"Plan tomorrow's top 3":"Write today's top 3";
  T(planTitle,'work',5,1);
  if(a.goal&&a.goal.trim())T('Review progress on: '+a.goal.trim().slice(0,50),'work',10,1,[0]);
  if(st.includes('procrastination'))T('Start the thing you are avoiding (just 2 minutes)','work',5,1);
  if(st.includes('stress'))T('5-minute breathing break','mind',5,2);
  if(st.includes('overwhelm'))T('Brain dump: write down everything on your mind','mind',5,2);
  if(st.includes('energy'))T('10 minutes of daylight outside','health',10,2);
  if(st.includes('motivation'))T('Write one line on why your goal matters','mind',3,3);
  if(st.includes('consistency'))T('Do your smallest habit, even on a bad day','work',2,1);

  if(foc('health')){
    const base={'Never':2,'1–2 times':3,'3–4 times':4,'5+ times':5}[a.exNow]??3;
    const n=Math.max(2,Math.min(6,base+dm));
    const pat={2:[1,4],3:[1,3,5],4:[1,2,4,6],5:[1,2,3,5,6],6:[1,2,3,4,5,6]}[n];
    const types=(a.exTypes&&a.exTypes.length)?a.exTypes:['Walking'];
    const map={};pat.forEach((d,i)=>{const t=types[i%types.length];(map[t]=map[t]||[]).push(d)});
    const mins=diff==='Gentle'?20:diff==='Ambitious'?45:30;
    for(const [t,days] of Object.entries(map))T(t+' session','health',mins,1,days,'');
    if(a.steps&&a.steps!=='none')T('Reach '+Number(a.steps).toLocaleString('en')+' steps','health',15,2);
    if(a.water&&a.water!=='none')T('Drink '+a.water+' L of water','health',3,2);
    if(has('eat','veg'))T('Eat vegetables with two meals','health',5,3);
    if(has('eat','sugar'))T('Skip sugary drinks and snacks','health',3,3);
    if(has('eat','cook'))T('Cook one meal at home','health',30,2,[1,2,3,4,5]);
    if(has('eat','protein'))T('Add protein to every meal','health',3,3);
    if(has('eat','snack'))T('No snacking after dinner','health',3,3);
    if(has('eat','prep'))T('Meal prep for the week','health',60,2,[0]);
  }
  if(foc('mind')){
    const r=Number(a.read||0);if(r)T('Read for '+r+' minutes','mind',r,2);
    if(['Never tried','Tried it once or twice','Sometimes'].includes(a.med))T('Meditate for '+(a.med==='Sometimes'?10:5)+' minutes','mind',a.med==='Sometimes'?10:5,2);
    if(a.med==='I do it already')T('Meditate for 10 minutes','mind',10,2);
    if(['Never','Sometimes'].includes(a.journal))T('Journal: three honest lines','mind',5,2);

/* ============ planning ============ */
function eligible(date){const d=new Date(date+'T12:00').getDay();return S.tasks.filter(t=>!t.days||t.days.includes(d))}
function makePlan(date,energy){
  const dow=new Date(date+'T12:00').getDay();
  const free={'15 min':15,'30 min':30,'1 hour':60,'90+ min':90}[S.a.free]||30;
  const ef={low:.6,ok:1,high:1.25}[energy||'ok'];
  const be={'Usually low':.85,'Up and down':1,'Usually good':1.1}[S.a.baseEnergy]||1;
  const df={Gentle:.8,Balanced:1,Ambitious:1.25}[S.a.diff]||1;
  const wf=(dow===0||dow===6)?({Lighter:.7,Heavier:1.25}[S.a.weekend]||1):1;
  const budget=free*ef*be*df*wf;let used=0;
  const el=eligible(date),pick=[];
  const fits=t=>pick.length<3||used+t.min<=budget*1.15;
  const add=t=>{pick.push(t.id);used+=t.min};
  el.filter(t=>t.src==='custom').forEach(add);
  const auto=el.filter(t=>t.src!=='custom');
  // must-do: core habits and tasks scheduled for specific days, as far as time allows
  auto.filter(t=>t.pri===1||(t.days&&t.days.length<=3&&t.pri<=2))
      .sort((x,y)=>x.pri-y.pri||hash(x.id+date)-hash(y.id+date))
      .forEach(t=>{if(fits(t))add(t)});
  // then fill remaining time, rotating through categories for variety
  const rest=auto.filter(t=>!pick.includes(t.id));
  const groups={};rest.forEach(t=>(groups[t.cat]=groups[t.cat]||[]).push(t));
  Object.values(groups).forEach(g=>g.sort((x,y)=>x.pri-y.pri||hash(x.id+date)-hash(y.id+date)));
  const cats=Object.keys(groups).sort((x,y)=>hash(x+date)-hash(y+date));
  let guard=0;
  while(cats.some(c=>groups[c].length)&&guard++<500){
    if(used>=budget&&pick.length>=3)break;
    for(const c of cats){
      const t=groups[c].shift();if(!t)continue;
      if(used>=budget&&pick.length>=3)break;
      if(fits(t))add(t);
    }
  }
  return pick;
}
function ensureToday(){
  const d=today();
  const L=S.log[d]||(S.log[d]={done:[],plan:null,energy:null,bonus:0});
  if(!L.plan)L.plan=makePlan(d,L.energy);
  return L;
}
function planned(L){return L.plan.map(id=>S.tasks.find(t=>t.id===id)).filter(Boolean)}
function dayDone(d){const L=S.log[d];if(!L||!L.plan||!L.plan.length)return false;const n=L.plan.filter(id=>L.done.includes(id)).length;return n/L.plan.length>=.5}
function streak(){let n=0;const d=new Date();if(!dayDone(ymd(d)))d.setDate(d.getDate()-1);while(dayDone(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function rebuild(){
  const lockedIds=new Set(S.tasks.filter(t=>t.locked).map(t=>t.id));
  const fresh=gen(S.a).filter(t=>!S.hidden.includes(t.id)&&!lockedIds.has(t.id));
  S.tasks=[...S.tasks.filter(t=>t.src==='custom'||t.locked),...fresh];
  const L=S.log[today()];if(L&&!L.done.length)L.plan=null;
  ensureToday();save();
}

/* ============ actions ============ */
function toggle(id){
  const L=ensureToday(),t=S.tasks.find(x=>x.id===id);if(!t)return;
  const c=coinsFor(t),i=L.done.indexOf(id);
  if(i<0){L.done.push(id);S.coins+=c;S.xp+=c;toast('+'+c+' 🪙  '+t.title)}
  else{L.done.splice(i,1);S.coins=Math.max(0,S.coins-c);S.xp=Math.max(0,S.xp-c)}
  const pl=planned(L),all=pl.length&&pl.every(t=>L.done.includes(t.id));
  if(all&&!L.bonus){L.bonus=10+Math.min(streak(),10)*2;S.coins+=L.bonus;S.xp+=L.bonus;toast('Perfect day! Bonus +'+L.bonus+' 🪙')}
  else if(!all&&L.bonus){S.coins=Math.max(0,S.coins-L.bonus);S.xp=Math.max(0,S.xp-L.bonus);L.bonus=0}
  save();render();
}

      <div class="meta"><span>${daysLabel(t.days)}</span><span>${t.min} min</span><span>${t.src==='custom'?'Yours':t.locked?'Edited':'Suggested'}</span></div></span><span class="mute">✎</span></button>`).join('')+`</div>`;
  }
  html+=`<div class="card"><b>Rebuild from my answers</b><p class="mute small" style="margin:4px 0 12px">Refreshes the suggested tasks. Your own and edited tasks stay.</p><button class="btn ghost sm" data-a="rebuild">Rebuild suggestions</button></div>`;
  return html;
}

/* ----- you ----- */
function youHTML(){
  const qs=visibleQs();
  const fmt=(q,v)=>{if(v==null||v===''||(Array.isArray(v)&&!v.length))return '—';
    const lab=x=>{const o=(q.opts||[]).find(o=>(Array.isArray(o)?o[0]:o)===x);return o?(Array.isArray(o)?o[1]:o):x};
    return Array.isArray(v)?v.map(lab).join(', '):lab(v)};
  const deep=DEEP.filter(d=>S.deep[d.id]&&S.deep[d.id].a);
  return `<div style="margin:6px 0 4px"><h2>${esc(S.a.name||'You')}</h2><div class="mute small">${S.a.goal?'Goal: '+esc(S.a.goal):'Your answers shape every task.'}</div></div>
   <div class="card"><b>Your answers</b><div class="tiny mute" style="margin-bottom:4px">Tap any answer to change it. Tasks update right away.</div>
   ${qs.map(q=>`<button class="qa" data-a="editq" data-id="${q.id}"><b>${esc(q.short)}</b><span>${esc(fmt(q,S.a[q.id]))}</span></button>`).join('')}
   <div style="margin-top:14px"><button class="btn ghost sm" data-a="retake">Go through all questions again</button></div></div>
   ${deep.length?`<div class="card"><b>Your reflections</b>${deep.map(d=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="tiny mute">${esc(d.q)}</div><div class="row sp" style="gap:8px"><span style="font-weight:600">${esc(S.deep[d.id].a)}</span>${d.task?`<button class="btn ghost sm" data-a="deeptask" data-id="${d.id}">Make task</button>`:''}</div></div>`).join('')}</div>`:''}
   <div class="card"><b>Your data</b><p class="mute small" style="margin:4px 0 12px">Everything is stored on this device only. To move to another phone or computer, export here and import there.</p>
   <div class="row" style="flex-wrap:wrap"><button class="btn ghost sm" data-a="export">Export backup</button><button class="btn ghost sm" data-a="import">Import backup</button><button class="btn danger sm" data-a="reset">Start over</button></div>
   <input type="file" id="imp" accept="application/json" hidden></div>`;
}

/* ----- sheets ----- */
function renderSheet(){
  const s=ui.sheet;
  if(!s){layer.innerHTML='';return}
  let inner='';
  if(s.kind==='plot'){
    const cur=S.city[s.i]?BLD.find(b=>b.id===S.city[s.i]):null,L=lvl(S.xp);
    if(cur)inner=`<div class="row" style="gap:14px"><div style="font-size:56px">${cur.e}</div><div><h2>${cur.n}</h2><div class="mute">${esc(cur.b)}</div></div></div>
      <div class="row" style="margin-top:18px"><button class="btn ghost" data-a="closesheet">Keep it</button><button class="btn danger" data-a="demolish">Demolish, refund ${Math.floor(cur.cost/2)} 🪙</button></div>`;
    else inner=`<div class="row sp"><h2>Build here</h2><span class="pill coin">🪙 ${S.coins}</span></div><div style="height:12px"></div>`+BLD.map(b=>{
      const locked=b.lvl>L,poor=S.coins<b.cost;
      return `<button class="bl" data-a="build" data-id="${b.id}" ${locked||poor?'disabled style="opacity:.55"':''}><span class="e">${b.e}</span><span class="grow"><b>${b.n}</b><div class="tiny mute">${locked?'Unlocks at level '+b.lvl:esc(b.b)}</div></span><b>${b.cost} 🪙</b></button>`}).join('');
  }else if(s.kind==='task'){
    const f=ui.tf;
    inner=`<h2>${f.id?'Edit task':'New task'}</h2>
     <label class="f" for="tf-t">What is it?</label><input type="text" id="tf-t" value="${esc(f.title)}" placeholder="e.g. Call the dentist">
     <label class="f" for="tf-c">Category</label><select id="tf-c">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${f.cat===k?'selected':''}>${c.e} ${c.n}</option>`).join('')}</select>
     <label class="f" for="tf-m">How long?</label><select id="tf-m">${[2,5,10,15,20,30,45,60,90].map(m=>`<option ${f.min===m?'selected':''} value="${m}">${m} min</option>`).join('')}</select>
     <label class="f">Which days?</label><div class="chips">${DAYORDER.map(d=>`<button class="chip ${f.days.includes(d)?'on':''}" data-a="tfday" data-d="${d}">${DAYN[d]}</button>`).join('')}</div>
     <div class="row" style="margin-top:22px">${f.id?'<button class="btn danger" data-a="deltask">Delete</button>':''}<button class="btn ghost" data-a="closesheet">Cancel</button><button class="btn" style="flex:1" data-a="savetask">Save</button></div>`;
  }
  layer.innerHTML=`<div class="shade" data-a="shade"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}
function openTask(t){
  ui.tf=t?{id:t.id,title:t.title,cat:t.cat,min:t.min,days:t.days?[...t.days]:[0,1,2,3,4,5,6]}:{id:null,title:'',cat:'work',min:15,days:[0,1,2,3,4,5,6]};
  ui.sheet={kind:'task'};renderSheet();
  setTimeout(()=>document.getElementById('tf-t')?.focus(),50);
}
function syncTf(){const f=ui.tf;if(!f)return;const g=id=>document.getElementById(id);if(g('tf-t')){f.title=g('tf-t').value;f.cat=g('tf-c').value;f.min=Number(g('tf-m').value)}}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='shade'){if(e.target===el){ui.sheet=null;renderSheet()}return}
  const w=ui.wiz;
  switch(a){
    case 'tab':ui.tab=el.dataset.k;render();window.scrollTo(0,0);break;
    case 'toggle':toggle(el.dataset.id);break;
    case 'energy':{const L=ensureToday();L.energy=el.dataset.v;if(!L.done.length)L.plan=makePlan(today(),L.energy);save();render();break}
    case 'bonus':{const L=ensureToday();const pool=eligible(today()).filter(t=>!L.plan.includes(t.id));
      if(!pool.length){toast('No more tasks to add. Nice work!');break}
      const t=pool[Math.floor(Math.random()*pool.length)];L.plan.push(t.id);L.bonus&&(S.coins=Math.max(0,S.coins-L.bonus),S.xp=Math.max(0,S.xp-L.bonus),L.bonus=0);save();render();toast('Added: '+t.title);break}
    case 'qdsave':{const v=document.getElementById('qd').value.trim();if(!v){toast('Type an answer first');break}S.deep[el.dataset.id]={a:v,date:today()};save();render();toast('Saved. See you tomorrow for the next one');break}
    case 'qdskip':S.skip.push(el.dataset.id);save();render();break;
    case 'deeptask':{const d=DEEP.find(x=>x.id===el.dataset.id);ui.tab='tasks';render();openTask(null);ui.tf.title=d.task(S.deep[d.id].a);renderSheet();break}
    case 'wizstart':w.intro=false;render();break;
    case 'pick':S.a[Q.find(q=>q.id===(w.only||visibleQs()[w.i].id)).id]=el.dataset.v;save();
      if(w.only){wizNext()}else{setTimeout(()=>{if(ui.wiz)wizNext()},120);render()}break;
    case 'multi':{const q=w.only?Q.find(x=>x.id===w.only):visibleQs()[w.i];const arr=S.a[q.id]||[];const v=el.dataset.v;S.a[q.id]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];save();render();break}
    case 'wiznext':{const q=w.only?Q.find(x=>x.id===w.only):visibleQs()[w.i];const inp=document.getElementById('wi');if(inp){S.a[q.id]=inp.value.trim();save()}wizNext();break}
    case 'wizback':if(w.i>0){const q=visibleQs()[w.i];const inp=document.getElementById('wi');if(inp&&q){S.a[q.id]=inp.value.trim();save()}w.i--;render()}break;
    case 'wizcancel':ui.wiz=null;render();break;
    case 'editq':ui.wiz={only:el.dataset.id};render();break;
    case 'retake':ui.wiz={i:0};render();break;
    case 'plot':ui.sheet={kind:'plot',i:Number(el.dataset.i)};renderSheet();break;
    case 'closesheet':ui.sheet=null;renderSheet();break;
    case 'build':{const b=BLD.find(x=>x.id===el.dataset.id);if(!b||S.coins<b.cost||lvl(S.xp)<b.lvl)break;S.coins-=b.cost;S.city[ui.sheet.i]=b.id;save();ui.sheet=null;render();toast(b.e+' '+b.n+' built!');break}
    case 'demolish':{const b=BLD.find(x=>x.id===S.city[ui.sheet.i]);S.coins+=Math.floor(b.cost/2);S.city[ui.sheet.i]=null;save();ui.sheet=null;render();break}
    case 'newtask':openTask(null);break;
    case 'edittask':openTask(S.tasks.find(t=>t.id===el.dataset.id));break;
    case 'tfday':{syncTf();const d=Number(el.dataset.d),f=ui.tf;f.days=f.days.includes(d)?f.days.filter(x=>x!==d):[...f.days,d];renderSheet();break}
    case 'savetask':{syncTf();const f=ui.tf;if(!f.title.trim()){toast('Give the task a name');break}if(!f.days.length){toast('Pick at least one day');break}
      const days=f.days.length===7?null:[...f.days].sort();
      if(f.id){const t=S.tasks.find(x=>x.id===f.id);Object.assign(t,{title:f.title.trim(),cat:f.cat,min:f.min,days,coins:Math.max(5,Math.round(f.min/5)*5)});if(t.src==='auto')t.locked=true}
      else S.tasks.push({id:'c-'+Date.now(),title:f.title.trim(),cat:f.cat,min:f.min,days,pri:1,src:'custom',coins:Math.max(5,Math.round(f.min/5)*5)});
      const L=S.log[today()];if(L&&!L.done.length)L.plan=null;
      ui.sheet=null;ui.tf=null;save();render();toast('Saved');break}
    case 'deltask':{const t=S.tasks.find(x=>x.id===ui.tf.id);if(t&&t.src==='auto'&&!S.hidden.includes(t.id))S.hidden.push(t.id);S.tasks=S.tasks.filter(x=>x.id!==ui.tf.id);const L=S.log[today()];if(L&&!L.done.length)L.plan=null;ui.sheet=null;ui.tf=null;save();render();break}
    case 'rebuild':S.hidden=[];rebuild();render();toast('Suggestions refreshed');break;
    case 'export':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='block-by-block-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
    case 'import':document.getElementById('imp').click();break;
    case 'reset':if(confirm('Delete your city, tasks and answers on this device? This cannot be undone.')){S=blank();save();ui={tab:'today',wiz:{i:0,intro:true}};render()}break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!('a' in d))throw 0;S={...blank(),...d};save();ui.tab='today';render();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}};r.readAsText(f)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&ui.wiz&&e.target.id==='wi')document.querySelector('[data-a=wiznext]')?.click();
  if(e.key==='Enter'&&e.target.classList?.contains('tile'))e.target.click();
  if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet()}
});

/* ============ boot ============ */
if(!S.onboarded)ui.wiz={i:0,intro:true};
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
